<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Подход 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/lime.png">
<link rel="icon" type="image/png" href="icons/lime.png">
<title>Подход 2</title>
<style>
:root{--bg:#10120f;--surface:#191d17;--surface2:#20251d;--surface3:#2c3228;--line:#2c3228;--text:#f1f3ec;--muted:#979e8e;--accent:#d3f489;--onaccent:#172009;--accent-ink:#d3f489;--tagbg:#252f1e;--tagfg:#d3f489;--hero:linear-gradient(115deg,#252f1e,#191d17 62%,#10120f);--deco:rgba(211,244,137,.10);--w1:#d3f489;--w2:#f2c14e;--w3:#ff7a59;--ok:#a6e04a;--warn:#f2c14e;--bad:#f0a69a;--focus:#d3f489;--shade:rgba(0,0,0,.65);--fb:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 16px/1.45 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.caps{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.acc{color:var(--accent-ink)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;letter-spacing:-.035em}
.brand svg{width:26px;height:26px;color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 4px 6px 10px;border:0;background:none;font-size:13px;font-weight:500;color:var(--muted)}
.pill svg{width:18px;height:18px}
.pill[data-s="saving"]{color:var(--warn)}
.pill[data-s="error"],.pill[data-s="local"]{color:var(--bad)}
.pill .dot{display:none}

main{max-width:560px;margin:0 auto;padding:18px 20px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-weight:700;font-size:32px;line-height:1.08;letter-spacing:-.035em;margin:6px 0 6px}
h2{font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.025em;margin:0}
h3{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
p{margin:6px 0}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 12px}
.sec-h .lnk{font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 10px}

.card{background:var(--surface);border-radius:20px;padding:18px;margin:12px 0;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--tagbg);color:var(--tagfg);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--tagbg);color:var(--tagfg)}
.hero{position:relative;overflow:hidden;background:var(--hero);padding:20px;border-radius:24px}
.hero .deco{position:absolute;right:-26px;bottom:62px;width:170px;height:170px;color:var(--deco);pointer-events:none}
.hero h1{font-size:44px;margin:16px 0 6px;position:relative}
.hero .meta,.hero .facts,.hero .eyebrow{position:relative}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.meta{font-size:14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:14px 0 4px;font-size:14px;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:7px}
.facts svg{width:17px;height:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column}
.stats .k{font-size:12px;color:var(--muted);line-height:1.25;min-height:30px}
.stats .v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.stats .s{font-size:11px;color:var(--muted);line-height:1.3}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:14px;border:0;font-weight:600;font-size:16px;letter-spacing:-.01em;background:var(--surface2);color:var(--text);text-align:center}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--accent);color:var(--onaccent)}
.btn-primary.go{justify-content:space-between;padding:12px 18px}
.btn-line{background:transparent;border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn-sm{min-height:44px;font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.link{background:none;border:0;padding:14px 0 2px;color:var(--muted);font-weight:500;font-size:15px;width:100%;text-align:center}
.lnk{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:8px 0;min-height:40px;color:var(--muted);font-size:14px;font-weight:500}
.lnk svg{width:17px;height:17px}
.linkrow{display:flex;justify-content:space-between;gap:10px;margin:4px 0}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px;margin:12px 0}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:500;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tagbg);color:var(--tagfg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}

.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px;margin:12px 0}
.weeks button{border:0;background:transparent;border-radius:13px;padding:9px 2px;min-height:54px;color:var(--text);font-weight:600;font-size:13px;line-height:1.3}
.weeks button small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.weeks button[aria-pressed="true"] small{color:var(--onaccent);opacity:.75}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:150px;color:var(--text)}
.dcard.next{border-color:var(--accent)}
.dcard .top-row{display:flex;justify-content:space-between;align-items:center;width:100%}
.dcard .top-row svg{width:16px;height:16px;color:var(--muted)}
.dcard h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:14px 0 4px}
.dcard .g{font-size:12px;color:var(--muted);line-height:1.35}
.dcard .ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--muted)}

.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0;color:var(--text)}
.lrow .ic{width:42px;height:42px;border-radius:12px;background:var(--tagbg);color:var(--tagfg);display:flex;align-items:center;justify-content:center}
.lrow .ic svg{width:20px;height:20px}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-weight:600}
.lrow .tx span{font-size:13px;color:var(--muted)}
.lrow>svg{width:18px;height:18px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.foot span:last-child{font-size:12px;color:var(--muted)}

/* workout */
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 12px}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 0;font-weight:500;font-size:14px;color:var(--muted);min-height:44px}
.back svg{width:18px;height:18px}
.ex-title{font-size:30px;margin:12px 0 4px}
.exstrip{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:2px 20px 6px;scrollbar-width:none}
.exstrip::-webkit-scrollbar{display:none}
.exchip{flex:none;display:flex;align-items:center;gap:10px;max-width:190px;min-height:52px;text-align:left;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1.25;color:var(--muted)}
.exchip .no{width:32px;height:32px;border-radius:9px;background:var(--surface3);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.exchip .no svg{width:16px;height:16px}
.exchip .nm{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.exchip[aria-current="true"]{border-color:var(--accent);color:var(--text)}
.exchip[aria-current="true"] .no{background:var(--accent);color:var(--onaccent)}
.exchip.done .no{background:var(--tagbg);color:var(--tagfg)}
.target{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px;text-align:center}
.target>div+div{border-left:1px solid var(--line)}
.target .caps{font-size:10px}
.target .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.prev{background:var(--surface2);border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:15px;font-weight:500}
.prev .caps{display:block;margin-bottom:4px;font-size:10px}
.sets{width:100%;border-collapse:collapse;margin:-4px 0 12px}
.sets th{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px}
.sets td{padding:0;border-top:1px solid var(--line)}
.sets td button{all:unset;display:block;width:100%;padding:12px 4px;cursor:pointer}
.sets td button:focus-visible{outline:2px solid var(--focus)}
.sets .big{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.sets tr.wu .big{color:var(--muted);font-weight:500}
.sets .tg{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.sets .more{color:var(--muted);text-align:right;font-weight:600}
.emptyst{text-align:center;padding:14px 10px 18px;color:var(--muted);font-size:14px}
.emptyst svg{width:30px;height:30px;color:var(--accent-ink);display:block;margin:0 auto 10px}
.emptyst b{display:block;color:var(--text);font-weight:600;font-size:15px;margin-bottom:2px}
.empty{padding:20px 8px;color:var(--muted);text-align:center;font-size:15px}
textarea,input[type=text],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:13px 14px;font-size:16px}
textarea{min-height:84px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted)}
label,.lbl{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px}
.hrow{border-top:1px solid var(--line);padding:12px 0}
.hrow:first-child{border-top:0;padding-top:0}
.hrow .d{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:3px}
.hrow .s{font-size:15px;font-weight:500}
.wu-t{color:var(--muted);font-weight:400}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button[aria-current="page"] svg{color:var(--accent-ink)}

.timer{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--onaccent);border-radius:18px;padding:7px 7px 7px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.timer>svg{width:20px;height:20px}
.timer .t-l{font-size:11px;font-weight:500;line-height:1;opacity:.75;display:block}
.timer .t-v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;display:block;min-width:56px}
.timer button{min-width:44px;min-height:44px;border:0;border-radius:12px;background:rgba(0,0,0,.1);color:inherit;font-weight:600;font-size:14px}
.timer.done{background:var(--text);color:var(--bg)}

.sheet-wrap{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:var(--shade);opacity:0;transition:opacity .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(92% - env(safe-area-inset-top,0px));overflow-y:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet-wrap.on .backdrop{opacity:1}
.sheet-wrap.on .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface3);margin:4px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.sh-title{font-weight:700;font-size:23px;letter-spacing:-.03em;line-height:1.15}
.x{min-width:40px;min-height:40px;border:0;border-radius:12px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.x svg{width:22px;height:22px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bignum{width:100%;text-align:center;font-weight:600;font-size:40px;letter-spacing:-.03em;line-height:1;padding:24px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.bignum:focus{border-color:var(--accent);outline:none}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.steps button{min-height:42px;border-radius:11px;border:0;background:var(--surface2);font-weight:500;font-size:14px}
.rir{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rir button{min-height:42px;border-radius:11px;border:0;background:var(--surface2);font-weight:500}
.rir button[aria-pressed="true"]{background:var(--tagbg);color:var(--tagfg);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 4px;font-weight:500}
details summary{cursor:pointer;padding:14px 0 6px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--muted)}
details[open] summary::before{content:"− "}

.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:10px 2px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-weight:500;color:var(--text)}
.pick .g{font-size:13px;color:var(--muted);font-weight:400}
.pick .src{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--tagbg);color:var(--tagfg);font-weight:600;white-space:nowrap}
.pick.cur{opacity:.4}
.grp{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}

.pex{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.pex .no{width:36px;height:36px;border-radius:10px;background:var(--tagbg);color:var(--tagfg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.pex .n{flex:1;min-width:0;font-weight:500}
.pex .n small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
.ib{min-width:34px;min-height:38px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.ib[disabled]{opacity:.25}
.planbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.planbox>div{background:var(--surface2);border-radius:14px;padding:10px 6px;text-align:center}
.planbox .v{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.planbox .caps{font-size:9px}
.planbox .st{display:flex;gap:4px;margin-top:8px}
.planbox .st button{flex:1;min-height:36px;border-radius:9px;border:0;background:var(--surface3);font-weight:700}

.sess-h{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;text-align:left;padding:0;color:var(--text)}
.sess-h .ic{width:44px;height:44px;border-radius:12px;background:var(--tagbg);color:var(--tagfg);display:flex;align-items:center;justify-content:center;flex:none}
.sess-h .ic svg{width:20px;height:20px}
.sess-h .tx{flex:1;min-width:0}
.sess-h .tx b{display:block;font-weight:600;font-size:17px}
.sess-h .tx span{font-size:13px;color:var(--muted)}
.sess-h>svg{width:18px;height:18px;color:var(--muted);transition:transform .15s}
.sess-h[aria-expanded="true"]>svg{transform:rotate(90deg)}
.sess-ex{border-top:1px solid var(--line);padding:11px 0}
.sess-ex .s{font-size:15px;font-weight:500}
.chart{width:100%;height:auto;display:block;margin:8px 0;color:var(--accent-ink)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.statgrid>div{background:var(--surface2);border-radius:14px;padding:12px}
.statgrid .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:15px;font-weight:500;width:max-content;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.note-box{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:15px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
pre.json{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:40vh;overflow:auto;background:var(--surface2);padding:10px;border-radius:14px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.themes button{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:500;text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  if(r.status===401)c='revoked';else if(r.status===403)c='forbidden';else if(r.status===404)c='missing';
  else if(r.status===413)c='quota_exceeded';else if(r.status===429)c='resource_exhausted';else if(r.status>=500)c='unavailable';
  throw{code:c};
}
async function authPassword(mode,email,password,name){
  const up=mode==='up';
  const r=await sbFetch(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',noAuthHeader:true,body:JSON.stringify(up?{email,password,data:{name}}:{email,password})},false);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:'auth',msg:authErr(j,r.status)};
  if(!j.access_token||!j.user)throw{code:'auth',msg:'Вход пока недоступен: владельцу приложения нужно выключить подтверждение почты в Supabase (Authentication → Sign In / Providers → Email → Confirm email).'};
  saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user_id:j.user.id,email:j.user.email||email,name:(j.user.user_metadata&&j.user.user_metadata.name)||name||''});
}
async function dbWrite(key,it){
  const now=new Date().toISOString(),pref={Prefer:'resolution=merge-duplicates,return=minimal'};
  if(key==='program'){
    if(it.op!=='set')return;
    await chk(await sbFetch('/rest/v1/user_data?on_conflict=user_id',{method:'POST',headers:pref,body:JSON.stringify({user_id:auth.user_id,root:it.data,updated_at:now})}));return;
  }
  const id=key.slice(9);
  if(it.op==='set')await chk(await sbFetch('/rest/v1/sessions?on_conflict=user_id,id',{method:'POST',headers:pref,body:JSON.stringify({user_id:auth.user_id,id,data:it.data,updated_at:now})}));
  else await chk(await sbFetch('/rest/v1/sessions?user_id=eq.'+encodeURIComponent(auth.user_id)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}}));
}
function handleFatal(code){
  if(code!=='revoked')return false;
  S.mode='auth';S.ui.authMsg='Сессия истекла. Войдите снова: несохранённые записи не потеряются.';render();return true;
}
async function flush(){
  if(!auth||S.mode==='auth'||flushing){updatePill();return}
  if(!Object.keys(outbox).length){if(S.status!=='error')S.status='saved';updatePill();return}
  flushing=true;S.status='saving';updatePill();
  try{
    while(true){
      const keys=Object.keys(outbox);if(!keys.length)break;
      const key=keys[0],it=outbox[key];
      try{
        await dbWrite(key,it);
        fails=0;
        if(outbox[key]===it){delete outbox[key];persistOut()}
      }catch(e){
        const code=(e&&e.code)||'unavailable';fails++;
        S.status='error';S.err=errText(code);
        if(handleFatal(code))return;
        if(!['invalid_argument','quota_exceeded','forbidden','missing'].includes(code)){
          clearTimeout(retryT);retryT=setTimeout(flush,Math.min(30000,1500*2**Math.min(fails,4))+Math.random()*1000);
        }
        return;
      }
    }
    S.status='saved';S.err='';S.lastSaved=new Date();
  }finally{flushing=false;updatePill()}
}
function syncNow(){flush();loadRemote()}
window.addEventListener('online',syncNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});

function applyRemote(row,list){
  if(!outbox.program&&!dirty.program)S.program=row?normalizeRootSafe(clone(row.root)):null;
  S.loadedProgram=true;
  const m={};list.forEach(r=>{m[r.id]=clone(r.data)});
  for(const k of Object.keys(S.sessions)){if(dirty['sessions/'+k]&&S.sessions[k])m[k]=S.sessions[k]}
  for(const k of Object.keys(outbox)){if(k.startsWith('sessions/')){const id=k.slice(9);if(outbox[k].op==='set')m[id]=clone(outbox[k].data);else delete m[id]}}
  S.sessions=m;S.loadedSessions=true;saveCache();
}
async function loadRemote(){
  if(!auth||S.mode!=='cloud'||loading)return;
  loading=true;const v=localVer;let again=false;
  try{
    const [a,b]=await Promise.all([sbFetch('/rest/v1/user_data?select=root&limit=1'),sbFetch('/rest/v1/sessions?select=id,data&limit=2000')]);
    await chk(a);await chk(b);
    const ra=await a.json(),rb=await b.json();
    if(v!==localVer){again=true}
    else{applyRemote(ra[0]||null,rb);if(!Object.keys(outbox).length){S.status='saved';S.err=''}}
  }catch(e){
    const code=(e&&e.code)||'unavailable';
    if(!handleFatal(code)){S.status='error';S.err=errText(code)}
  }finally{loading=false;updatePill();requestRender();if(again)setTimeout(loadRemote,400)}
}
async function initCloud(){
  S.loadedProgram=false;S.loadedSessions=false;
  await loadRemote();flush();
}


function pendingCount(){return Object.keys(outbox).length+Object.keys(dirty).length}
function updatePill(){
  const p=$('#pill'),t=$('#pillT');if(!p)return;
  let s,txt;const n=pendingCount();
  if(S.mode==='connecting'){s='connecting';txt='Подключение…'}
  else if(S.mode==='local'){s='local';txt=n?`Не отправлено: ${n}`:'Только на устройстве'}

  else if(n||S.status==='saving'){s='saving';txt='Сохраняю…'}
  else{s='saved';txt='Сохранено'}
  p.dataset.s=s;t.textContent=txt;
}

function drawIcon(cv,size){
  const ctx=cv.getContext('2d');ctx.fillStyle='#0c0d0b';ctx.fillRect(0,0,size,size);
  const {img,zoom,ox,oy}=IC,base=Math.max(size/img.width,size/img.height)*zoom,w=img.width*base,h=img.height*base;
  const mx=Math.max(0,(w-size)/2),my=Math.max(0,(h-size)/2);

}

  cv.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(x){}});

    if(!last)return;

    const base=Math.max(240/IC.img.width,240/IC.img.height)*IC.zoom,mx=(IC.img.width*base-240)/2,my=(IC.img.height*base-240)/2;

}

const CAP=s=>s.charAt(0).toUpperCase()+s.slice(1);
function sheetHead(title,sub){return `<div class="grab"></div><div class="sh-head"><div><div class="sh-title">${esc(title)}</div>${sub?`<div class="meta" style="margin-top:4px">${esc(sub)}</div>`:''}</div><button class="x" data-a="closesheet" aria-label="Закрыть">${I.x}</button></div>`}

function weeksTabs(p,sel,action){

  return `<div class="weeks" role="group" aria-label="Неделя" style="grid-template-columns:repeat(${Math.min(M,4)},1fr)">${p.plans.map((pl,k)=>`<button data-a="${action}" data-w="${k}" aria-pressed="${k===sel}"><small>Неделя ${k+1}</small>${esc(pwname(p,k))}</button>`).join('')}</div>`;
}
function todayView(){

  if(act){
    const dn=(act.entries||[]).filter(e=>e.done).length;
    h+=`<div class="card hero" style="margin-top:22px"><div class="deco">${I.dumb}</div>
      <div class="eyebrow">Тренировка идёт</div>
      <div class="wpos">${esc(sessPos(act))}</div><div class="meta" style="margin-top:6px">Цикл ${act.cycle||1} · Неделя ${act.week} · ${esc(sname(act))} · ${esc(fmtShort(act.date))}</div>
      <h1>${esc(sessName(act))}</h1><div class="meta">${esc(groupsOfIds((act.entries||[]).map(e=>e.exerciseId)))}</div>
      <div class="facts"><span>${I.check}${dn} из ${(act.entries||[]).length} упражнений</span><span>${I.reps}${workingSets(act)} рабочих подх.</span></div>
      <button class="btn btn-primary go" data-a="open" data-id="${act.id}" style="margin-top:16px"><span>Продолжить тренировку</span>${I.arrow}</button>
    </div>`;
  }else{
    const plan=p.plans[n.week],ids=p.templates[n.day]||[];

      <div class="eyebrow">Следующая тренировка</div>
      <div class="wpos">Тренировка №${n.week*N+n.day+1}/${N*M}</div><div class="meta" style="margin-top:6px">${esc(p.name)} · Цикл ${n.cycle} · Неделя ${n.week+1} · ${esc(pwname(p,n.week))}</div>
      <h1>${esc(dayNameP(p,n.day))}</h1><div class="meta">${esc(groupsOfP(p,n.day))}</div>
      <div class="facts"><span>${I.dumb}${ids.length} ${plural(ids.length,'упражнение','упражнения','упражнений')}</span><span>${I.reps}${plan.min}–${plan.max} повторений</span></div>
      ${ids.length?`<button class="btn btn-primary go" data-a="start" data-w="${n.week}" data-d="${n.day}" style="margin-top:16px"><span>Начать тренировку</span>${I.arrow}</button>`:`<p class="meta" style="margin-top:14px">В этой тренировке нет упражнений. Добавьте их в программе.</p>`}
      <button class="link" data-a="pickday">Выбрать другую тренировку</button>
    </div>`;
  }
  h+=`<div class="stats">

    <div><div class="k">Рабочих подходов</div><div class="v">${done.reduce((a,s)=>a+workingSets(s),0)}</div><div class="s">в завершённых тренировках</div></div>
    <div><div class="k">Текущая неделя</div><div class="v">${n.week+1}</div><div class="s">${esc(pwname(p,n.week))} · цикл ${n.cycle}</div></div>

  ${weeksTabs(p,hw,'hweek')}
  <div class="grid2">${p.templates.map((ids,d)=>`<button class="dcard${hw===n.week&&d===n.day?' next':''}" data-a="hday" data-w="${hw}" data-d="${d}">
    <span class="top-row"><span class="caps" style="font-size:10px">Тренировка №${hw*N+d+1}/${N*M}</span>${I.arrow}</span>
    <h3>${esc(dayNameP(p,d))}</h3><span class="g">${esc(groupsOfP(p,d))}</span>

function workoutView(s){
  const ents=s.entries||[];
  if(S.ui.exIdx>=ents.length)S.ui.exIdx=Math.max(0,ents.length-1);
  const i=S.ui.exIdx,e=ents[i];
  let h=`<div class="topline"><button class="back" data-a="closewo">${I.back} К тренировкам</button><span class="caps">${esc(sname(s))} · Неделя ${s.week}</span></div>`;
  if(e){
    h+=`<span class="tag">${esc(e.group||'Упражнение')}</span><h1 class="ex-title">${esc(e.exerciseName)}</h1>
    <div class="sub">${esc(fmtDate(s.date,{day:'numeric',month:'long',year:'numeric'}))} · ${esc(sessName(s))}${s.status==='done'?' · завершена':''}</div><div class="meta" style="margin-top:2px">${esc(sessCtx(s))}</div>`;
  }else h+=`<h1>${esc(sessName(s))}</h1>`;
  h+=`<div class="exstrip">${ents.map((x,k)=>`<button class="exchip${x.done?' done':''}" data-a="ex" data-i="${k}" aria-current="${k===i}"><span class="no">${x.done&&k!==i?I.check:pad(k+1)}</span><span class="nm">${esc(x.exerciseName)}</span></button>`).join('')}
    <button class="exchip" data-a="addex"><span class="no">${I.plus}</span><span class="nm">Добавить</span></button></div>`;
  if(!e)return h+`<div class="empty">В тренировке нет упражнений. Добавьте первое.</div>`+woBottom(s);
  const pl=e.plan||{},ws=(e.sets||[]).filter(z=>!z.warmup&&z.myoRole!=='mini').length,prev=prevFor(e.exerciseId,s.id);
  h+=`<div class="card target"><div><div class="caps">Подходы</div><div class="v">${pl.sets??'–'}</div></div><div><div class="caps">Повторения</div><div class="v">${pl.min!=null?pl.min+'–'+pl.max:'–'}</div></div><div><div class="caps">Запас повторов</div><div class="v">${pl.rir==null?'–':(pl.rir===0?'отказ':pl.rir)}</div></div></div>`;
  if(prev)h+=`<div class="prev"><span class="caps">Прошлый раз · ${esc(fmtShort(prev.s.date))} · ${esc(sname(prev.s))}</span>${entryLine(prev.e)}</div>`;
  h+=techCard(e.exerciseId);
  h+=`<div class="card"><div class="card-h"><h3>Текущая тренировка</h3><span class="badge">${myoBlockIds(e).length?myoBlockIds(e).length+' '+plural(myoBlockIds(e).length,'блок','блока','блоков')+' Myo':ws+'/'+(pl.sets??'–')}</span></div>`;
  h+=methodSwitch(e);
  h+=setsBlock(e);
  h+=`<div class="stack">${e.method==='myo'?`<button class="btn btn-primary" data-a="myoadd">${I.plus} Добавить блок Myo-reps</button><button class="btn btn-line" data-a="addwu">Добавить разминку</button>`:`<button class="btn btn-primary" data-a="addset">${I.plus} Добавить подход</button>`}
    <button class="btn" data-a="exdone">${I.check} ${e.done?'Снять отметку «завершено»':'Завершить упражнение'}</button></div>
    <label for="enote">Заметка к упражнению</label><textarea id="enote" data-f="enote" placeholder="Техника, самочувствие, особенности тренажёра…">${esc(e.note||'')}</textarea></div>
  <div class="linkrow"><button class="lnk" data-a="replace">${I.swap} Заменить упражнение</button><button class="lnk" data-a="rest">${I.clock} Отдых ${fmtRest()}</button></div>
  <div class="linkrow"><button class="lnk" data-a="planopen">${I.swap} План и метод упражнения</button></div>${S.ui.planOpen?planEditor(e)+prefCard(e.exerciseId):''}`;
  const rows=historyRows(e.exerciseId).filter(r=>r.s.id!==s.id);
  h+=`<div class="sec-h"><h2>История упражнения</h2><span class="meta">${rows.length} ${plural(rows.length,'запись','записи','записей')}</span></div><p class="hint">Рабочие веса и повторы. Разминка — внутри записи.</p>`;
  if(rows.length){
    h+=`<div class="card">${rows.slice(0,5).map(r=>`<div class="hrow"><div class="d"><span>${esc(fmtDate(r.s.date))} · ${esc(sessName(r.s))}</span><span>${esc(sname(r.s))}</span></div><div class="s">${entryLine(r.e)}</div><div class="meta" style="font-size:12px">${esc(sessCtx(r.s))}</div>${r.e.note?`<div class="meta">${esc(r.e.note)}</div>`:''}</div>`).join('')}
      ${rows.length>1?`<button class="btn btn-sm btn-line" data-a="hist" data-id="${esc(e.exerciseId)}" style="margin-top:6px">${I.hist} График и вся история</button>`:''}</div>`;
  }else h+=`<div class="card emptyst">${I.hist}<b>Здесь будет твоя история</b>После тренировки появятся дата, тип недели, веса и повторы.</div>`;
  return h+woBottom(s);
}
function woBottom(s){
  return `<div class="sec-h"><h2>Тренировка целиком</h2></div>
  <label for="snote" style="margin-top:0">Заметка к тренировке</label>
  <textarea id="snote" data-f="snote" placeholder="Как прошла тренировка?">${esc(s.note||'')}</textarea>
  <div class="stack" style="margin-top:14px">
    ${s.status==='active'?`<button class="btn btn-primary" data-a="finish">${I.check} Завершить тренировку</button>`:`<button class="btn" data-a="closewo">Готово</button>`}
    <button class="btn btn-danger" data-a="delsess" data-id="${s.id}">Удалить тренировку</button>
  </div>`;
}
function fmtRest(){const v=+(S.program&&S.program.restSeconds)||0;return Math.floor(v/60)+':'+pad(v%60)}

function programView(){
  if(S.ui.draft)return programEditor();
  const sel=S.ui.progId&&progById(S.ui.progId);

  const r=S.program,list=progs();
  let h=`<div class="caps">Мои программы</div><h1 style="margin-top:10px">Программы</h1><p class="sub">Активная программа задаёт тренировки на экране «Сегодня». История упражнений общая для всех программ.</p>`;

  h+=`<button class="btn btn-primary" data-a="pnew" style="margin-top:14px">${I.plus} Создать программу</button>`;
  return h;
}
function programDetail(p){
  const r=S.program,act=p.id===r.activeId,{N,M}=dims(p);
  let w=S.ui.progWeek;if(w>=M)w=0;
  const pl=p.plans[w];
  let h=`<div class="topline"><button class="back" data-a="plist">${I.back} Все программы</button>${act?'<span class="badge">Активная</span>':''}</div>
  <h1>${esc(p.name)}</h1><p class="sub">${pluralDays(N)} в неделю · цикл ${pluralWeeks(M)}</p>
  <div class="row" style="margin-top:14px">${act?'':`<button class="btn btn-primary btn-sm" data-a="pactivate" data-id="${esc(p.id)}">Сделать активной</button>`}<button class="btn btn-sm" data-a="pedit" data-id="${esc(p.id)}">Изменить</button><button class="btn btn-sm btn-line" data-a="pcopy" data-id="${esc(p.id)}">Копия</button></div>
  ${weeksTabs(p,w,'pweek')}
  <div class="card"><div class="card-h"><h3>Нагрузка · ${esc(pwname(p,w))}</h3></div>
    <div class="planbox">${[['sets','Подходы'],['min','Повт. от'],['max','Повт. до'],['rir','Запас']].map(([f,k])=>`<div><div class="caps">${k}</div><div class="v">${pl[f]}</div></div>`).join('')}</div>
  </div>`;
  p.templates.forEach((ids,d)=>{
    h+=`<div class="card"><div class="card-h"><div><div class="caps" style="font-size:10px">Тренировка №${w*N+d+1}/${N*M}</div><h2 style="margin-top:6px">${esc(dayNameP(p,d))}</h2><div class="meta" style="font-size:13px;margin-top:2px">${esc(groupsOfP(p,d))}</div></div>${act&&ids.length?`<button class="btn btn-sm" data-a="hday" data-w="${w}" data-d="${d}" style="width:auto">${I.play} Начать</button>`:''}</div>
      ${ids.length?ids.map((id,k)=>{const e=exById(id),sp=slotPlan(p,w,d,k),has=!!(p.overrides&&p.overrides[slotKey(w,d,k)]);return `<div class="pex"><span class="no">${pad(k+1)}</span><div class="n">${esc(e?e.name:id)}<small>${esc(e?e.group:'')} · ${planStr(sp)} · запас ${sp.rir}${has?' · своя нагрузка':''}</small></div><button class="ib" data-a="slotopen" data-d="${d}" data-k="${k}" aria-label="Настроить нагрузку">⚙</button></div>${slotEditor(p,w,d,k)}`}).join(''):'<div class="meta">Упражнений пока нет.</div>'}
    </div>`;
  });
  if(!act)h+=`<button class="btn btn-danger" data-a="pdel" data-id="${esc(p.id)}" style="margin-top:8px">Удалить программу</button>`;
  return h;
}
function programEditor(){
  const D=S.ui.draft,p=D.prog,{N,M}=dims(p);
  let w=S.ui.progWeek;if(w>=M)w=S.ui.progWeek=M-1;
  const pl=p.plans[w];
  let h=`<div class="topline"><button class="back" data-a="pcancel">${I.back} Отменить</button><span class="caps">${D.isNew?'Новая программа':'Изменение программы'}</span></div>
  <label for="pname" style="margin-top:0">Название</label><input type="text" id="pname" data-f="pname" value="${esc(p.name)}" placeholder="Например, Верх / низ — 3 недели">
  <div class="sec-h"><h2>Недели цикла</h2><div class="row" style="flex:none;gap:6px"><button class="ib" data-a="pweeks" data-v="-1" ${M<=1?'disabled':''} aria-label="Меньше недель" style="background:var(--surface2)">−</button><span class="badge" style="align-self:center">${M}</span><button class="ib" data-a="pweeks" data-v="1" ${M>=12?'disabled':''} aria-label="Больше недель" style="background:var(--surface2)">+</button></div></div>
  ${weeksTabs(p,w,'pweek')}
  <div class="card"><div class="card-h"><h3>Неделя ${w+1}</h3></div>
    <label for="wname" style="margin-top:0">Название недели</label><input type="text" id="wname" data-f="wname" maxlength="40" value="${esc((p.weekNames&&p.weekNames[w])||'')}" placeholder="${esc(CAP(kindOf(pl).name))}" style="margin-bottom:12px">
    <div class="chips" style="margin-bottom:10px">${Object.entries(KINDS).map(([k,v])=>`<button class="chip" data-a="pkind" data-v="${k}" aria-pressed="${(pl.kind||'normal')===k}">${CAP(v.name)}</button>`).join('')}</div>
    <div class="planbox">${[['sets','Подходы'],['min','Повт. от'],['max','Повт. до'],['rir','Запас']].map(([f,k])=>`<div><div class="caps">${k}</div><div class="v">${pl[f]}</div><div class="st"><button data-a="pstep" data-f="${f}" data-d="-1" aria-label="Меньше">−</button><button data-a="pstep" data-f="${f}" data-d="1" aria-label="Больше">+</button></div></div>`).join('')}</div>
  </div>
  <div class="sec-h"><h2>Тренировки в неделю</h2><div class="row" style="flex:none;gap:6px"><button class="ib" data-a="pdays" data-v="-1" ${N<=1?'disabled':''} aria-label="Меньше тренировок" style="background:var(--surface2)">−</button><span class="badge" style="align-self:center">${N}</span><button class="ib" data-a="pdays" data-v="1" ${N>=7?'disabled':''} aria-label="Больше тренировок" style="background:var(--surface2)">+</button></div></div>`;
  p.templates.forEach((ids,d)=>{
    h+=`<div class="card"><label for="dn${d}" style="margin-top:0">Тренировка ${d+1}: название</label><input type="text" id="dn${d}" data-f="dname" data-d="${d}" value="${esc(dayNameP(p,d))}">
      <div style="margin-top:8px">${ids.map((id,k)=>{const e=exById(id)||libById(id);return `<div class="pex"><span class="no">${pad(k+1)}</span><div class="n">${esc(e?e.name:id)}<small>${esc(e?e.group:'')} · ${planStr(slotPlan(p,w,d,k))}</small></div><button class="ib" data-a="slotopen" data-d="${d}" data-k="${k}" aria-label="Настроить нагрузку">⚙</button><button class="ib" data-a="pmove" data-d="${d}" data-k="${k}" data-v="-1" ${k===0?'disabled':''} aria-label="Выше">↑</button><button class="ib" data-a="pmove" data-d="${d}" data-k="${k}" data-v="1" ${k===ids.length-1?'disabled':''} aria-label="Ниже">↓</button><button class="ib" data-a="prep" data-d="${d}" data-k="${k}" aria-label="Заменить">⇄</button><button class="ib" data-a="prem" data-d="${d}" data-k="${k}" aria-label="Убрать">✕</button></div>${slotEditor(p,w,d,k)}`}).join('')}</div>
      <button class="btn btn-sm btn-line" data-a="padd" data-d="${d}" style="margin-top:8px">${I.plus} Добавить упражнение</button></div>`;
  });
  h+=`<div class="err" id="perr" role="alert"></div><div class="stack"><button class="btn btn-primary" data-a="psave">${I.check} Сохранить программу</button><button class="btn btn-line" data-a="pcancel">Отменить</button></div>`;
  return h;
}

function diaryView(){
  if(S.ui.histEx)return historyView(S.ui.histEx,true);
  let h=`<div class="caps">Каждый подход имеет значение</div><div class="dh"><h1 style="margin-top:10px">Дневник</h1><button class="btn btn-sm" data-a="export" style="width:auto">${I.dl} Копия</button></div>
  <p class="sub">Все тренировки по датам. Раскрой запись, чтобы увидеть подходы.</p>
  `;

function historyRows(exId){

function topOf(e){
  const ws=(e.sets||[]).filter(x=>!x.warmup);if(!ws.length)return null;
  if(e.mode==='body')return ws.reduce((a,b)=>(b.reps>a.reps?b:a));
  if(e.mode==='assistance')return ws.reduce((a,b)=>(b.weight<a.weight||(b.weight===a.weight&&b.reps>a.reps)?b:a));
  return ws.reduce((a,b)=>(b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps)?b:a));
}
function chartSVG(rows,mode){
  const pts=rows.slice(0,24).reverse().map(r=>({t:topOf(r.e),d:r.s.date})).filter(p=>p.t);
  if(pts.length<2)return '';
  const val=p=>mode==='body'?p.t.reps:p.t.weight;
  const vs=pts.map(val),mn=Math.min(...vs),mx=Math.max(...vs),W=320,H=120,P=14;
  const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>mx===mn?H/2:H-P-(v-mn)*(H-2*P)/(mx-mn);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(val(p)).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}" role="img" aria-label="${mode==='body'?'Лучшие повторы':(mode==='assistance'?'Помощь гравитрона':'Лучший рабочий вес')} по тренировкам">
    <path d="${path}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(val(p)).toFixed(1)}" r="4" fill="var(--surface)" stroke="currentColor" stroke-width="2"/>`).join('')}
    <text x="${P}" y="${H+14}" font-size="11" fill="var(--muted)">${esc(fmtShort(pts[0].d))}</text>
    <text x="${W-P}" y="${H+14}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtShort(pts[pts.length-1].d))}</text>
  </svg>`;
}
function historyView(exId,inDiary){

  return h;
}

/* ---------- week names, per-exercise plans ---------- */
function slotKey(w,d,k){return (w+1)+':'+d+':'+k}
function slotPlan(p,w,d,k){const o=p.overrides&&p.overrides[slotKey(w,d,k)];return o||p.plans[w]}
function pwname(p,i){const n=p.weekNames&&String(p.weekNames[i]||'').trim();return n||CAP(kindOf(p.plans[i]).name)}
function sname(s){return s.weekName?String(s.weekName):CAP(sk(s).name)}
function ovRemove(p,d,k){const o=p.overrides;if(!o)return;const n={};for(const key of Object.keys(o)){const a=key.split(':').map(Number);if(a[1]!==d){n[key]=o[key];continue}if(a[2]===k)continue;n[a[0]+':'+a[1]+':'+(a[2]>k?a[2]-1:a[2])]=o[key]}p.overrides=n}
function ovSwap(p,d,x,y){const o=p.overrides;if(!o)return;const n={};for(const key of Object.keys(o)){const a=key.split(':').map(Number);n[a[0]+':'+a[1]+':'+(a[1]===d&&a[2]===x?y:a[1]===d&&a[2]===y?x:a[2])]=o[key]}p.overrides=n}
function ovTrim(p){const o=p.overrides;if(!o)return;const N=p.templates.length,M=p.plans.length,n={};for(const key of Object.keys(o)){const a=key.split(':').map(Number);if(a[0]>=1&&a[0]<=M&&a[1]<N&&a[2]<(p.templates[a[1]]||[]).length)n[key]=o[key]}p.overrides=n}
function editProgram(fn){
  if(S.ui.draft){fn(S.ui.draft.prog);render();return}
  const np=clone(S.program),pp=np.programs.find(x=>x.id===S.ui.progId);if(!pp)return;fn(pp);put('program',np);render();
}
const PLAN_LIM={sets:[1,20],min:[1,100],max:[1,100],rir:[0,10]};
function stepPlan(pl,f,d){const l=PLAN_LIM[f],n={sets:pl.sets,min:pl.min,max:pl.max,rir:pl.rir};n[f]=Math.min(l[1],Math.max(l[0],n[f]+d));if(n.min>n.max){if(f==='min')n.max=n.min;else n.min=n.max}return n}
function planGrid(pl,attrs){return `<div class="planbox">${[['sets','Подходы'],['min','Повт. от'],['max','Повт. до'],['rir','Запас']].map(([f,t])=>`<div><div class="caps">${t}</div><div class="v">${pl[f]}</div><div class="st"><button data-f2="${f}" ${attrs} data-v="-1" aria-label="Меньше">−</button><button data-f2="${f}" ${attrs} data-v="1" aria-label="Больше">+</button></div></div>`).join('')}</div>`}
function slotEditor(p,w,d,k){
  if(S.ui.slot!==slotKey(w,d,k))return '';
  const key=slotKey(w,d,k),pl=slotPlan(p,w,d,k),has=!!(p.overrides&&p.overrides[key]);
  return `<div class="slotbox"><div class="caps">Нагрузка на неделю ${w+1}</div>${planGrid(pl,`data-a="slotstep" data-d="${d}" data-k="${k}"`)}${has?`<button class="lnk" data-a="slotreset" data-d="${d}" data-k="${k}">Использовать общую нагрузку недели</button>`:`<p class="meta" style="margin:8px 0 0">Сейчас общая нагрузка недели. Измените значение, чтобы задать свою для этого упражнения.</p>`}</div>`;
}
function planEditor(e){
  return `<div class="card"><div class="caps">План этого упражнения в тренировке</div>${planGrid(e.plan||{sets:3,min:8,max:12,rir:2},'data-a="eplan"')}<p class="meta" style="margin:10px 0 0">Меняет план только в этой тренировке.</p></div>`;
}

/* ---------- Myo-reps ---------- */
function wTxt(mode,w){return mode==='body'?'Свой вес':(mode==='added'?'+':mode==='assistance'?'Помощь ':'')+fmtN(w)+' кг'}
function blockSummary(sets,mode){const ws=new Set(sets.map(x=>x.weight));return ws.size===1?wTxt(mode,sets[0].weight)+' · '+sets.map(x=>x.reps).join(' + ')+' повт.':sets.map(x=>wTxt(mode,x.weight)+' × '+x.reps).join(' + ')}
function myoBlockIds(e){const ids=[];(e.sets||[]).forEach(x=>{if(x.myoBlockId&&ids.indexOf(x.myoBlockId)<0)ids.push(x.myoBlockId)});return ids}
function entryLine(e){
  const normal=(e.sets||[]).filter(x=>!x.myoBlockId),ids=myoBlockIds(e),parts=[];
  if(normal.length)parts.push(setsLine(e.mode,normal));
  ids.forEach((b,i)=>parts.push('<b>Myo'+(ids.length>1?' '+(i+1):'')+':</b> '+esc(blockSummary(e.sets.filter(x=>x.myoBlockId===b),e.mode))));
  return parts.join(' · ');
}
function entryMethods(e){const w=(e.sets||[]).filter(x=>!x.warmup);return w.length?[...(w.some(x=>!x.myoBlockId)?['standard']:[]),...(w.some(x=>x.myoBlockId)?['myo']:[])]:[e.method||'standard']}
function matchesMethod(e,f){return f==='all'||entryMethods(e).indexOf(f)>=0}
function suggestedMethod(id){
  const ex=exById(id);if(ex&&ex.preferredMethod)return ex.preferredMethod;
  const prior=historyRows(id).find(r=>(r.e.sets||[]).some(x=>!x.warmup));
  if(!prior)return 'standard';
  return prior.e.method||((prior.e.sets||[]).some(x=>x.myoBlockId)?'myo':'standard');
}
function methodSwitch(e){return `<div class="seg" role="group" aria-label="Метод выполнения" style="margin:0 0 10px">${[['standard','Обычные'],['myo','Myo-reps']].map(([k,t])=>`<button type="button" data-a="method" data-v="${k}" aria-pressed="${(e.method||'standard')===k}">${t}</button>`).join('')}</div>`}
function prefCard(id){

}
function setPreferred(id,val){
  ensureExercise(id);const np=clone(S.program),ex=np.exercises.find(x=>x.id===id);if(!ex)return;
  if(val==='auto')delete ex.preferredMethod;else ex.preferredMethod=val;

function methodChips(){const f=S.ui.histMethod||'all';return `<div class="chips" role="group" aria-label="Метод выполнения">${[['all','Все методы'],['standard','Обычные'],['myo','Myo-reps']].map(([k,t])=>`<button class="chip" data-a="hmethod" data-v="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>`}
function setsBlock(e){
  const sets=e.sets||[];
  if(!sets.length)return `<div class="emptyst">${I.dumb}<b>${e.method==='myo'?'Добавьте активацию и мини-подходы':'Первый подход — начало прогресса'}</b>Разминку можно отметить отдельно</div>`;
  let h='';

      <td><button data-a="editset" data-k="${k}" tabindex="-1"><span class="big">${wv}</span>${st.note?`<span class="tg">${esc(st.note)}</span>`:''}</button></td>

  }
  myoBlockIds(e).forEach((bid,bi)=>{
    const rows=sets.filter(x=>x.myoBlockId===bid),tot=rows.reduce((a,x)=>a+x.reps,0),vol=Math.round(rows.reduce((a,x)=>a+x.weight*x.reps,0)*100)/100;

      <table class="sets"><tbody>${rows.map((x,i)=>`<tr><td><span class="big">${x.myoRole==='activation'?'А':i}</span><span class="tg">${x.myoRole==='activation'?'активация':'мини-подход'}</span></td><td><span class="big">${e.mode==='body'?'—':fmtN(x.weight)+' кг'}</span>${x.note?`<span class="tg">${esc(x.note)}</span>`:''}</td><td><span class="big">${x.reps}</span></td></tr>`).join('')}</tbody></table>
      <div class="meta">Всего ${tot} повт.${e.mode==='weight'?' · объём '+fmtN(vol)+' кг':''}</div></div>`;

  return h;

function myoRerender(){const c=sheetCtx;if(!c||c.type!=='myo')return;const y=sheet.scrollTop;sheet.innerHTML=myoHtml(c);sheet.scrollTop=y}
function myoInput(t){
  const c=sheetCtx;if(!c||c.type!=='myo')return;const f=t.dataset.f,i=+t.dataset.i;
  if(f==='my_w')c.w=t.value;else if(f==='my_r')c.r=t.value;else if(f==='my_n')c.n=t.value;

function myoSave(){
  const c=sheetCtx;if(!c||c.type!=='myo')return;const err=$('#myoerr'),body=c.mode==='body';
  const reps=[c.r,...c.minis.map(m=>m.r)];
  if(!reps.every(v=>/^\d+$/.test(v)&&+v>=1&&+v<=300)){err.textContent='Заполните активацию и каждый мини-подход: от 1 до 300 повторений. Пустой мини-подход можно убрать.';return}
  const base=body?0:parseN(c.w);
  if(!body&&!(base>=0&&base<=2000)){err.textContent='Введите вес блока числом, например 30. Допустимо от 0 до 2000 кг.';return}
  for(const m of c.minis){if(!body&&m.own){const w=parseN(m.w);if(!(w>=0&&w<=2000)){err.textContent='Введите вес мини-подхода: от 0 до 2000 кг.';return}}}
  const s=getS(c.sid);if(!s){err.textContent='Тренировка не найдена. Закройте окно и откройте её снова.';return}
  const e=s.entries[c.i],bid=c.bid||newId();
  const mk=(id,w,r,n,role)=>({id,weight:Math.round(w*100)/100,reps:+r,warmup:false,rir:null,note:(n||'').trim(),myoBlockId:bid,myoRole:role});
  const sets=[mk(c.actId,base,c.r,c.n,'activation'),...c.minis.map(m=>mk(m.id,body?0:(m.own?parseN(m.w):base),m.r,m.n,'mini'))];
  const first=e.sets.findIndex(x=>x.myoBlockId===bid),rest=e.sets.filter(x=>x.myoBlockId!==bid);
  if(rest.length+sets.length>100){err.textContent='Максимум — 100 записей подходов на упражнение.';return}
  const idx=first<0?rest.length:first;e.sets=[...rest.slice(0,idx),...sets,...rest.slice(idx)];
  put('sessions/'+s.id,s);closeSheet();render();if(!c.bid)startTimer();
}
function posOf(p,w1,d){if(!p||!p.templates||!p.plans)return null;const N=p.templates.length,M=p.plans.length;if(!N||!M)return null;return {n:(w1-1)*N+d+1,total:N*M}}
function sessPos(s){const q=posOf(sessProg(s),s.week,s.day);return q?'Тренировка №'+q.n+'/'+q.total:''}
function sessCtx(s){return [sessPos(s),'Цикл '+(s.cycle||1),'Неделя '+s.week,s.weekName].filter(Boolean).join(' · ')}
function libraryView(){

function libById(id){const r=LIBRARY.find(x=>x[0]===id);return r?{id:r[0],name:r[1],group:r[2],mode:r[3]}:null}

function createExercise(){
  const name=($('#nxn').value||'').trim();let g=$('#nxg').value;if(g==='__new')g=($('#nxg2').value||'').trim();
  const mode=$('#nxm').value,err=$('#nxerr');
  if(!name){err.textContent='Введите название упражнения.';return null}
  if(!g){err.textContent='Укажите группу мышц.';return null}
  const p=prog();
  if(p.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){err.textContent='Такое упражнение уже есть в списке.';return null}
  const ex={id:'x-'+newId().slice(0,8),name,group:g,mode};
  if(S.ui.draft)S.ui.draft.exercises.push(ex);
  else{const np=clone(S.program);np.exercises.push(ex);put('program',np)}
  return ex.id;
}

/* ---------- timer ---------- */
let T=null,tInt=null;
function startTimer(){const sec=+(S.program&&S.program.restSeconds);if(!(sec>0))return;T={end:Date.now()+sec*1000,buzz:false};clearInterval(tInt);tInt=setInterval(tick,500);tick()}
function tick(){
  const el=$('#timer');if(!T){el.hidden=true;return}
  const r=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  el.hidden=false;el.classList.toggle('done',r===0);el.classList.toggle('up',!!$('.actionbar'));
  $('#tL').textContent=r?'Отдых':'Отдых окончен';$('#tV').textContent=Math.floor(r/60)+':'+pad(r%60);
  if(r===0&&!T.buzz){T.buzz=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(r===0&&Date.now()-T.end>60000){T=null;clearInterval(tInt);el.hidden=true}
}

function backupText(root,sessions,now){
  const KN={light:'лёгкая',medium:'средняя',heavy:'тяжёлая',normal:'обычная'};
  const all=(root&&root.programs)||[];
  const pById=id=>all.find(p=>p.id===id);
  const n=v=>String(Math.round((+v||0)*100)/100).replace('.',',');
  const dt=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch(e){return iso}};
  const setStr=(mode,s)=>{
    let w;
    if(mode==='body')w=s.weight?`свой вес +${n(s.weight)} кг`:'свой вес';
    else if(mode==='assistance')w=`помощь ${n(s.weight)} кг`;
    else if(mode==='added')w=`+${n(s.weight)} кг`;
    else w=`${n(s.weight)} кг`;
    return `${w} × ${s.reps}`+(s.rir!=null?`, запас ${s.rir>=4?'4+':s.rir}`:'')+(s.warmup?' (разминка)':'')+(s.note?` — ${s.note}`:'');
  };
  const list=sessions.slice().sort((a,b)=>String(b.startedAt||b.date).localeCompare(String(a.startedAt||a.date)));
  const L=[];
  L.push('ПОДХОД — дневник силовых тренировок');
  L.push('Копия от '+now.toLocaleString('ru-RU'));
  L.push('Тренировок: '+list.length);
  L.push('');
  for(const s of list){
    const p=pById(s.programId||'p-main');
    const name=s.dayName||(p&&p.dayNames&&p.dayNames[s.day])||('Тренировка '+(s.day+1));
    const pos=(p&&p.templates&&p.plans&&p.templates.length&&p.plans.length)?' · Тренировка №'+((s.week-1)*p.templates.length+s.day+1)+'/'+(p.templates.length*p.plans.length):'';
    const kind=s.kind||(p&&p.plans[s.week-1]&&p.plans[s.week-1].kind)||['light','medium','heavy','heavy'][s.week-1]||'normal';
    L.push('════════════════════════════════════════');
    L.push(`${dt(s.date)} · ${name}${pos} · неделя ${s.week} (${s.weekName||KN[kind]||''})${p?' · '+p.name:''}${s.status==='active'?' · не завершена':''}`);
    L.push('');
    for(const e of s.entries||[]){
      if(!(e.sets||[]).length&&!e.note)continue;
      const pl=e.plan?` [план ${e.plan.sets}×${e.plan.min}–${e.plan.max}]`:'';
      L.push(e.exerciseName+pl+((e.sets||[]).some(x=>x.myoBlockId)?' · Myo-reps':''));
      let k=0;
      const bl=[];for(const st of e.sets||[]){if(st.myoBlockId&&bl.indexOf(st.myoBlockId)<0)bl.push(st.myoBlockId)}
      for(const st of e.sets||[]){const bi=st.myoBlockId?bl.indexOf(st.myoBlockId)+1:0;const lab=st.warmup?'Р':st.myoRole?(st.myoRole==='activation'?'А':'м'):String(++k);L.push(`  ${lab}) ${setStr(e.mode,st)}${st.myoRole?' [Myo-reps, блок '+bi+', '+(st.myoRole==='activation'?'активация':'мини-подход')+']':''}`)}
      if(e.note)L.push('  Заметка: '+e.note);
      L.push('');
    }
    if(s.note){L.push('Заметка к тренировке: '+s.note);L.push('')}
  }
  const ex=id=>((root&&root.exercises)||[]).find(e=>e.id===id);
  for(const p of all.filter(p=>!p.archived)){
    L.push('════════════════════════════════════════');
    L.push('ПРОГРАММА: '+p.name+(root.activeId===p.id?' (активная)':''));
    (p.templates||[]).forEach((t,d)=>L.push(`${(p.dayNames||[])[d]||('Тренировка '+(d+1))}: `+t.map(id=>(ex(id)||{name:id}).name).join('; ')));
    (p.plans||[]).forEach((pl,i)=>L.push(`Неделя ${i+1} (${(p.weekNames&&p.weekNames[i])||KN[pl.kind]||'обычная'}): ${pl.sets}×${pl.min}–${pl.max}, запас ${pl.rir}`));
    L.push('');
  }
  L.push('---- ДАННЫЕ ДЛЯ ВОССТАНОВЛЕНИЯ (вставьте в файл .json и откройте «Восстановить из копии») ----');
  const pr=JSON.parse(JSON.stringify(root||{}));delete pr.updatedAt;delete pr.backup;
  L.push(JSON.stringify({format:'podhod-backup',exportedAt:now.toISOString(),data:Object.assign({},pr,{schema:2,sessions:list.slice().reverse()})}));
  return L.join('\n');
}

/* ---------- export / import ---------- */
function buildBackup(){
  const p=clone(S.program)||{};delete p.backup;delete p.updatedAt;
  return {format:'podhod-backup',exportedAt:new Date().toISOString(),data:Object.assign(p,{schema:2,sessions:sessionsList().reverse().map(clone)})};
}
function fileStamp(){const d=new Date();return todayISO()+' '+pad(d.getHours())+'-'+pad(d.getMinutes())}
async function saveFile(name,text,mime){
  const file=new File([text],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'shared'}}
  catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'download'}catch(e){}
  return 'fail';
}
function textSheet(name,text){
  openSheet(`${sheetHead('Резервная копия')}<p class="meta">Сохранение файла здесь недоступно. Выделите текст ниже, скопируйте и сохраните в «Заметки» или «Файлы» как ${esc(name)}.</p><pre class="json">${esc(text)}</pre>`);
}
async function doExport(){
  if(!S.program)return;
  const text=backupText(S.program,Object.values(S.sessions),new Date()),name='Подход '+fileStamp()+'.txt';
  const r=await saveFile(name,text,'text/plain');
  if(r==='fail')textSheet(name,text);else if(r==='download')toast('Файл скачан');else if(r==='shared')toast('Готово');
}
async function doExportJson(){
  if(!S.program)return;
  const text=JSON.stringify(buildBackup(),null,1),name='podhod '+fileStamp()+'.json';
  const r=await saveFile(name,text,'application/json');
  if(r==='fail')textSheet(name,text);else if(r==='download')toast('Файл скачан');else if(r==='shared')toast('Готово');
}

$('#fileIn').addEventListener('change',async ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  const raw=await f.text();let b=null;
  try{b=JSON.parse(raw)}catch(e){const k='---- ДАННЫЕ ДЛЯ ВОССТАНОВЛЕНИЯ',i=raw.indexOf(k);if(i>=0){try{b=JSON.parse(raw.slice(i).split('\n').slice(1).join('\n').trim())}catch(e2){}}}
  if(!b){toast('Файл не читается как копия «Подхода»');return}
  const d=b&&b.data;
  const v2=d&&Array.isArray(d.programs)&&d.programs.length,v1=d&&Array.isArray(d.templates)&&Array.isArray(d.plans);
  if(!b||b.format!=='podhod-backup'||!d||!Array.isArray(d.exercises)||!Array.isArray(d.sessions)||!(v2||v1)){toast('Это не резервная копия «Подхода»');return}
  const n=Object.keys(S.sessions).length;
  const ok=await confirmSheet({title:'Восстановить из копии?',text:`Копия от ${b.exportedAt?new Date(b.exportedAt).toLocaleString('ru-RU'):'неизвестной даты'}: ${d.sessions.length} ${plural(d.sessions.length,'тренировка','тренировки','тренировок')}. Программа и весь дневник будут заменены${n?`, сейчас в дневнике ${n}`:''}.`,ok:'Восстановить',danger:n>0});
  closeSheet();if(!ok)return;
  const root=normalizeRoot(v2?(()=>{const x=clone(d);delete x.sessions;return x})():{exercises:d.exercises,templates:d.templates,plans:d.plans,nextIndex:d.nextIndex||0,restSeconds:d.restSeconds??120,dayNames:d.dayNames||DEFAULT_PROGRAM.dayNames});
  if(S.program&&S.program.backup)root.backup=S.program.backup;
  put('program',root);
  const keep=new Set(d.sessions.map(s=>s.id));
  for(const id of Object.keys(S.sessions))if(!keep.has(id))del('sessions/'+id);
  for(const s of d.sessions)put('sessions/'+s.id,clone(s));
  S.ui.openId=null;render();toast('Копия восстановлена, отправляю на сервер');
});

  import(){$('#fileIn').click()},
  async startdefault(){const ok=await confirmSheet({title:'Начать со своей программы?',text:'Загрузится программа «Тяни / Жми» на 4 недели. Дневник будет пустым.',ok:'Начать'});closeSheet();if(!ok)return;put('program',normalizeRoot(clone(DEFAULT_PROGRAM)));render()},
  async pushlocal(){const ok=await confirmSheet({title:'Отправить данные с устройства?',text:'Программа и тренировки, сохранённые в этом браузере, будут записаны в хранилище.',ok:'Отправить'});closeSheet();if(!ok)return;put('program',normalizeRoot(clone(bootCache.program)));for(const s of Object.values(bootCache.sessions||{}))put('sessions/'+s.id,clone(s));render()},
  theme(t){try{localStorage.setItem(THEME_KEY,t.dataset.v)}catch(e){}applyTheme();render()},
  tech(t){if(!S.ui.tech)S.ui.tech={};S.ui.tech[t.dataset.id]=!S.ui.tech[t.dataset.id];render()},
  exgroup(t){S.ui.exGroup=t.dataset.v;render()},
  method(t){const s=curSession();if(!s)return;s.entries[S.ui.exIdx].method=t.dataset.v;put('sessions/'+s.id,s);render()},
  myoadd(){myoOpen(null)},
  myoedit(t){myoOpen(t.dataset.b)},
  myoaddmini(){const c=sheetCtx;if(c&&c.type==='myo'){c.minis.push({id:newId(),r:'',own:false,w:'',n:''});myoRerender()}},
  myodelmini(t){const c=sheetCtx;if(c&&c.type==='myo'){c.minis.splice(+t.dataset.i,1);myoRerender()}},
  myosave:myoSave,
  async myodel(){
    const c=sheetCtx;if(!c||c.type!=='myo')return;
    const ok=await confirmSheet({title:'Удалить блок целиком?',text:'Будут удалены активация и все мини-подходы этого блока.',ok:'Удалить',danger:true});
    closeSheet();if(!ok)return;
    const s=getS(c.sid);if(!s)return;const e=s.entries[c.i];e.sets=e.sets.filter(x=>x.myoBlockId!==c.bid);put('sessions/'+s.id,s);render();
  },
  addwu(){openSetSheet(null,true)},
  planopen(){S.ui.planOpen=!S.ui.planOpen;render()},
  eplan(t){const s=curSession();if(!s)return;const e=s.entries[S.ui.exIdx];e.plan=stepPlan(e.plan||{sets:3,min:8,max:12,rir:2},t.dataset.f2,+t.dataset.v);put('sessions/'+s.id,s);render()},
  hmethod(t){S.ui.histMethod=t.dataset.v;render()},
  slotopen(t){const p=S.ui.draft?S.ui.draft.prog:progById(S.ui.progId),w=Math.min(S.ui.progWeek,dims(p).M-1),key=slotKey(w,+t.dataset.d,+t.dataset.k);S.ui.slot=S.ui.slot===key?null:key;render()},
  slotstep(t){const d=+t.dataset.d,k=+t.dataset.k,f=t.dataset.f2,v=+t.dataset.v;editProgram(p=>{const w=Math.min(S.ui.progWeek,p.plans.length-1),cur=slotPlan(p,w,d,k);p.overrides=p.overrides||{};p.overrides[slotKey(w,d,k)]=stepPlan(cur,f,v)})},
  slotreset(t){const d=+t.dataset.d,k=+t.dataset.k;editProgram(p=>{const w=Math.min(S.ui.progWeek,p.plans.length-1);if(p.overrides)delete p.overrides[slotKey(w,d,k)]})},
  hweek(t){S.ui.homeWeek=+t.dataset.w;render()},
  async hday(t){
    const w=+t.dataset.w,d=+t.dataset.d;
    {const a=activeSession();if(a&&(a.entries||[]).some(e=>(e.sets||[]).length)){toast('Сначала завершите начатую тренировку');return}}
    const p=AP(),pl=p.plans[w];
    const ok=await confirmSheet({title:'Начать «'+dayNameP(p,d)+'»?',text:'Неделя '+(w+1)+', '+pwname(p,w)+': '+planStr(pl)+' повторений, '+rirStr(pl)+'.',ok:'Начать тренировку'});
    closeSheet();if(ok)startSession(w,d);
  },
  rest(){startTimer()},
  iconpick(){$('#iconIn').click()},
  iconsave(){
    if(!IC)return;const cv=document.createElement('canvas');cv.width=cv.height=180;drawIcon(cv,180);
    const d=cv.toDataURL('image/png');
    try{localStorage.setItem(ICON_KEY,d)}catch(e){toast('Не удалось сохранить значок');return}
    applyIcon();iconDoneSheet(d);if(S.ui.tab==='settings'&&S.mode!=='auth')requestRender();
  },
  iconset(t){try{localStorage.setItem(ICON_KEY,'preset:'+t.dataset.v)}catch(e){}applyIcon();iconDoneSheet(iconHref());render()},
  iconreset(){try{localStorage.removeItem(ICON_KEY)}catch(e){}applyIcon();toast('Значок сброшен на стандартный');render()},
  eye(t){const show=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',show);t.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');['apass','apass2'].forEach(id=>{const e=document.getElementById(id);if(e)e.type=show?'text':'password'})},
  amode(t){S.ui.auth.mode=t.dataset.v;S.ui.authMsg='';render()},
  reload(){S.status='saving';render();loadRemote()},
  exportjson:doExportJson,
  startblank(){put('program',{schema:2,exercises:[],programs:[],activeId:null,restSeconds:120});S.ui.tab='program';render()},
  async signout(){
    const n=pendingCount();
    const ok=await confirmSheet({title:'Выйти из аккаунта?',text:n?`Есть неотправленных изменений: ${n}. Они останутся на этом устройстве и отправятся после входа в тот же аккаунт.`:'Данные остаются на сервере. Войти можно снова в любой момент.',ok:'Выйти',danger:n>0});
    closeSheet();if(!ok)return;
    try{await sbFetch('/auth/v1/logout',{method:'POST'},false)}catch(e){}
    try{localStorage.removeItem(AUTH_KEY)}catch(e){}
    location.reload();
  },
  t30(){if(T){T.end=Math.max(T.end,Date.now())+30000;T.buzz=false;tick()}},
  tstop(){T=null;clearInterval(tInt);tick()},
};
function curTheme(){try{return localStorage.getItem(THEME_KEY)||'forest'}catch(e){return 'forest'}}
function newEntry(id,plan){const e=exById(id,S.program)||exById(id)||libById(id)||{id,name:id,group:'',mode:'weight'};return{id:newId(),exerciseId:e.id,exerciseName:e.name,mode:e.mode||'weight',group:e.group||'',plan:clone(plan),sets:[],method:suggestedMethod(e.id),done:false,note:''}}
function startSession(w,d){
  const p=AP(),act=activeSession();if(!p)return;
  if(act&&(act.entries||[]).some(e=>(e.sets||[]).length)){S.ui.openId=act.id;render();toast('Сначала завершите начатую тренировку');return}
  if(act)del('sessions/'+act.id);
  const pl=p.plans[w]||p.plans[0];
  const s={id:newId(),programId:p.id,dayName:dayNameP(p,d),kind:pl.kind||'normal',programName:p.name,weekName:(p.weekNames&&String(p.weekNames[w]||'').trim())||undefined,week:w+1,day:d,cycle:nextPos(p).cycle,date:todayISO(),startedAt:new Date().toISOString(),finishedAt:null,status:'active',note:'',entries:(p.templates[d]||[]).map((id,idx)=>newEntry(id,(p.overrides&&p.overrides[slotKey(w,d,idx)])||pl))};
  put('sessions/'+s.id,s);S.ui.openId=s.id;S.ui.exIdx=0;render();scrollTopApp();
}
function flushNotes(){for(const k of Object.keys(dirty)){const id=k.slice(9);putNow(k,()=>getS(id))}if(dirty.program)putNow('program',()=>S.program)}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(f){ev.preventDefault();f(t,ev)}
});
document.addEventListener('input',ev=>{
  const t=ev.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='enote'||f==='snote'){const s=curSession();if(!s)return;if(f==='enote')s.entries[S.ui.exIdx].note=t.value;else s.note=t.value;const id=s.id;putSoon('sessions/'+id,()=>getS(id));updatePill()}
  else if(f==='aemail'){S.ui.auth.email=t.value}
  else if(f==='aname'){S.ui.auth.name=t.value}
  else if(f==='wname'){if(S.ui.draft){const p=S.ui.draft.prog;p.weekNames=p.weekNames||[];while(p.weekNames.length<p.plans.length)p.weekNames.push('');p.weekNames[S.ui.progWeek]=t.value}}
  else if(f.slice(0,3)==='my_'||f.slice(0,3)==='mi_'){myoInput(t)}
  else if(f==='pname'){if(S.ui.draft)S.ui.draft.prog.name=t.value}
  else if(f==='dname'){if(S.ui.draft)S.ui.draft.prog.dayNames[+t.dataset.d]=t.value}
  else if(f==='rest'){const v=parseInt(t.value,10);if(v>=0&&v<=900){S.program.restSeconds=v;putSoon('program',()=>S.program)}}
  else if(f==='exsearch'||f==='pksearch'){const q=t.value.trim().toLowerCase();const root=f==='pksearch'?sheet:$('#app');root.querySelectorAll('[data-n]').forEach(r=>{r.hidden=q&&!r.dataset.n.includes(q)});root.querySelectorAll('[data-grp]').forEach(g=>{g.hidden=!!q})}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset&&(t.dataset.f==='enote'||t.dataset.f==='snote')){const s=curSession();if(s)putNow('sessions/'+s.id,()=>getS(s.id))}
  if(t.dataset&&t.dataset.f==='rest')putNow('program',()=>S.program);
  if(t.id==='nxg'){$('#nxg2').hidden=t.value!=='__new'}
  if(t.dataset&&t.dataset.f==='wname')render();
  if(t.dataset&&t.dataset.f==='mi_own')myoToggleOwn(t);
  if(t.dataset&&t.dataset.f==='prefm')setPreferred(t.dataset.id,t.value);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!wrap.hidden)A.closesheet()});
window.addEventListener('pagehide',()=>{flushNotes();persistOut()});

S.ui.auth={mode:'in',email:'',name:''};
S.userName=((auth&&auth.name)||'').trim().split(/\s+/)[0]||'';
S.mode=auth?'cloud':'auth';
S.ui.tech={};
{const av=document.getElementById('avatar');if(av)av.textContent=(S.userName||(auth&&auth.email)||'·').charAt(0).toUpperCase()}
render();
if(auth)initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
